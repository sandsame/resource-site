    let currentCategory = '全部';

    renderFilters();
    renderList();

    function renderFilters() {
        const categories = ['全部', ...new Set(resources.map(r => r.category))];
        const bar = document.getElementById('filterBar');
        bar.innerHTML = categories.map(c =>
            `<button class="filter-btn ${c === currentCategory ? 'active' : ''}" onclick="filterBy('${c}')">${c}</button>`
        ).join('');
    }

    function filterBy(category) {
        currentCategory = category;
        renderFilters();
        renderList();
    }

    function renderList() {
        const keyword = document.getElementById('searchInput').value.toLowerCase();
        const filtered = resources.filter(r => {
            const matchCategory = currentCategory === '全部' || r.category === currentCategory;
            const matchKeyword = !keyword || r.title.toLowerCase().includes(keyword)
                || r.tags.some(t => t.toLowerCase().includes(keyword))
                || r.desc.toLowerCase().includes(keyword);
            return matchCategory && matchKeyword;
        });

        const list = document.getElementById('resourceList');
        const empty = document.getElementById('emptyState');

        if (filtered.length === 0) {
            list.innerHTML = '';
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';
        list.innerHTML = filtered.map(r => `
            <li class="resource-item">
                <h3>${r.title}</h3>
                <p class="desc">${r.desc}</p>
                <div class="meta">
                    <div class="tags">${r.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
                    <a href="${r.link}" target="_blank" rel="noopener" class="download-btn">免费领取</a>
                </div>
            </li>
        `).join('');
    }

    document.getElementById('searchInput').addEventListener('input', renderList);
    </script>
